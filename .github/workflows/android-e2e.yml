name: Android Appium E2E Automation CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Runs nightly at 2:00 AM UTC

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    name: Build APK and Run Appium Tests
    runs-on: macos-latest  # macOS supports hardware acceleration (nested virtualization) for Android Emulator out of the box
    timeout-minutes: 45

    steps:
      # Stage 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Stage 2: Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Stage 3: Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Stage 4: Set up Flutter
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile
          flutter pub get

      # Stage 5: Build Debug APK
      - name: Build Android Debug APK
        run: |
          cd mobile
          flutter build apk --debug
          echo "APK_PATH=$(pwd)/build/app/outputs/flutter-apk/app-debug.apk" >> $GITHUB_ENV

      # Stage 6: Install Node.js & Start Appium Server
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20

      # Stage 9 & 10: Start Appium Server
      - name: Install and Start Appium
        run: |
          npm install -g appium
          npm install -g appium-uiautomator2-driver
          appium --log logs/appium.log &
          echo "Appium started in background."

      # Stage 6 & 7: Start Android Emulator and Verify Readiness
      # We use the reactivecircus emulator action which runs the emulator in Mac hardware virtualization
      - name: Setup & Run Android Emulator and E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          # Stage 8, 11-17: Run E2E tests inside the emulator context
          script: |
            # Set environment variables for E2E run
            export EXECUTION_MODE="live"
            export APK_PATH="${{ env.APK_PATH }}"
            export OPENBLAS_NUM_THREADS="1"
            
            # Setup Python
            echo "Setting up Python E2E environment..."
            python3 -m pip install --upgrade pip
            python3 -m pip install -r automation/requirements.txt
            
            # Run test orchestrator
            cd automation
            python3 run_tests.py

      # Stage 18: Upload Test Artifacts (Excel, HTML, Logs, Screenshots)
      - name: Upload Test Execution Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ImposterX_E2E_Test_Reports
          path: automation/reports/
          retention-days: 30

      # Stage 19 & 20: Deploy Reports to GitHub Pages & Update History
      - name: Prepare GitHub Pages Folders
        if: always()
        run: |
          mkdir -p pages-deploy/reports/latest
          mkdir -p pages-deploy/reports/history/build-${{ github.run_number }}
          
          # Copy reports to latest directory
          cp -R automation/reports/HTML/* pages-deploy/reports/latest/
          cp -R automation/reports/Screenshots pages-deploy/reports/latest/ || true
          cp -R automation/reports/Logs pages-deploy/reports/latest/ || true
          cp automation/reports/Summary/summary.md pages-deploy/reports/latest/ || true
          
          # Archive a copy for build history
          cp -R pages-deploy/reports/latest/* pages-deploy/reports/history/build-${{ github.run_number }}/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-deploy
          keep_files: true  # This maintains historical builds on gh-pages branch

      # Stage 21: Publish GitHub Action Summary
      - name: Write GHA Job Summary
        if: always()
        run: |
          if [ -f automation/reports/github_summary.md ]; then
            cat automation/reports/github_summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "### Automation run failed to compile summary report." >> $GITHUB_STEP_SUMMARY
          fi
